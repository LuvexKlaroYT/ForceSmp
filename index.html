<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForceSMP LX</title>
    <style>
        :root {
            --bg-color: #080c10;
            --accent-color: #00ffff;
            --accent-glow: rgba(0, 255, 255, 0.4);
            --text-color: #ffffff;
            --secondary-text: #8892b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #101c2c 0%, var(--bg-color) 100%);
        }

        /* Sprachumschalter Oben Links */
        .lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }

        .lang-btn:hover, .lang-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Hauptcontainer */
        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: 2px;
        }

        .status-badge {
            font-size: 1.2rem;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* IP-Kästchen (Kopiergeschützt / Readonly) */
        .ip-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--accent-color);
            padding: 12px 24px;
            font-size: 1.2rem;
            color: var(--accent-color);
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            user-select: all; /* Ermöglicht leichtes Markieren mit einem Klick */
            transition: 0.3s;
        }

        .ip-box:hover {
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .ip-input {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            width: 220px;
            cursor: pointer;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Sprachumschalter Oben Links -->
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('de')">DE</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="container">
        <h1 id="title">FORCE SMP LX</h1>
        <div class="status-badge" id="status-text">SERVER IS IN BUILDING</div>

        <!-- IP-Kästchen (Readonly / Geschützt) -->
        <div class="ip-box" onclick="copyIP()">
            <input type="text" id="server-ip" class="ip-input" value="IN BUILDING" readonly>
        </div>
    </div>

    <script>
        // Kleine Sprachsteuerung (DE/EN)
        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const statusText = document.getElementById('status-text');
            if (lang === 'de') {
                statusText.innerText = "SERVER IS IN BUILDING";
            } else {
                statusText.innerText = "SERVER IS IN BUILDING";
            }
        }

        // IP in die Zwischenablage kopieren beim Anklicken
        function copyIP() {
            const copyText = document.getElementById("server-ip");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            // Optionales kurzes Feedback
            const originalVal = copyText.value;
            copyText.value = "COPIED!";
            setTimeout(() => {
                copyText.value = originalVal;
            }, 1200);
        }
    </script>

</body>
</html>
